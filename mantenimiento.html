<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento - HC Group Latam</title>
  <link rel="icon" type="image/png" href="./Health and Clinic Group Original.png">
  <style>
    :root {
      --hc-blue: #0E70B6;
      --hc-blue-deep: #0C558A;
      --hc-green: #94C11E;
      --ink: #16222B;
      --gray: #56616B;
      --paper: #FFFFFF;
      --display: "Poppins", system-ui, sans-serif;
      --body: "Source Sans 3", system-ui, sans-serif;
    }
    body {
      font-family: var(--body);
      color: var(--ink);
      background: var(--paper);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .logo {
      margin-bottom: 40px;
      height: 150px;
      max-width: 90vw;
    }
    h1 {
      font-family: var(--display);
      font-size: 2.5rem;
      color: var(--hc-blue-deep);
      margin-bottom: 15px;
      font-weight: 800;
    }
    p {
      font-size: 1.1rem;
      color: var(--gray);
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--hc-blue), var(--hc-blue-deep));
      color: white;
      padding: 12px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-family: var(--display);
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(14, 112, 182, 0.2);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <img src="./assets/img/Health%20and%20Clinic%20Group%20Original.png" alt="HC GROUP Logo" class="logo" style="width: auto; max-width: 100%; object-fit: contain;">
  <h1>Sitio en Mantenimiento</h1>
  <p>Estamos trabajando en esta sección para ofrecerle una mejor experiencia. Por favor, vuelva a intentarlo más tarde o regrese a la página principal.</p>
  <a href="./index.html" class="btn">Volver al inicio</a>
</body>
</html>
