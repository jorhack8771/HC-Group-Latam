  <!-- Google reCAPTCHA v3 -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LdRSY0tAAAAAOCZl8HlmlTC9fYfi2CQtpTgd6Da"></script>
  <script>
    window.getRecaptchaToken = async function() {
      const siteKey = '6LdRSY0tAAAAAOCZl8HlmlTC9fYfi2CQtpTgd6Da'; 

      return new Promise((resolve) => {
        // Fallback timeout in case reCAPTCHA fails to load (e.g., domain not authorized)
        const timeout = setTimeout(() => {
          resolve('');
        }, 3000);

        try {
          if (typeof grecaptcha === 'undefined') {
            clearTimeout(timeout);
            return resolve('');
          }

          grecaptcha.ready(function() {
            try {
              grecaptcha.execute(siteKey, {action: 'submit'})
              .then(function(token) {
                clearTimeout(timeout);
                resolve(token);
              })
              .catch(function(err) {
                clearTimeout(timeout);
                // Usamos warn en lugar de error para evitar falsas alarmas de crash en la consola
                console.warn('reCAPTCHA aviso (dominio no verificado):', err);
                resolve(''); 
              });
            } catch (executeErr) {
              clearTimeout(timeout);
              console.warn('reCAPTCHA no pudo ejecutarse (dominio no verificado):', executeErr);
              resolve('');
            }
          });
        } catch (e) {
          clearTimeout(timeout);
          resolve('');
        }
      });
    };
  </script>
